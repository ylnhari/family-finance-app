name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — the app and its tests are stdlib-only.
      - name: Python tests (server, persistence, --demo isolation, gemini parse)
        run: python -m unittest discover -s tests -p "test_*.py" -v
        env:
          # Windows runner profiles may expose TEMP through an 8.3 alias
          # (RUNNER~1) while Path.resolve() returns the long spelling. Use the
          # runner-owned long path so canonical portlib path tests compare one
          # stable representation on every OS.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: JS tests (finance math, sample integrity)
        run: node --test tests/math.test.js tests/sample.test.js
