name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install — the app and its tests are stdlib-only.
      - name: Python tests (server, persistence, --demo isolation, gemini parse)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: JS tests (EMI/amortization/prepayment math + sample-data integrity)
        run: node --test tests/math.test.js tests/sample.test.js
