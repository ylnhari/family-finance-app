<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Finance</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236ea8ff'/><stop offset='.55' stop-color='%232456e6'/><stop offset='1' stop-color='%23163bb0'/></linearGradient></defs><rect width='64' height='64' rx='15' fill='url(%23g)'/><rect x='1.5' y='1.5' width='61' height='61' rx='13.5' fill='none' stroke='white' stroke-opacity='.25' stroke-width='1.5'/><circle cx='32' cy='32' r='19.5' fill='white' fill-opacity='.16' stroke='white' stroke-width='3'/><text x='32' y='44' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='34' fill='%23163bb0' fill-opacity='.5'>%E2%82%B9</text><text x='32' y='43' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='34' fill='white'>%E2%82%B9</text></svg>">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="brand-icon">&#9679;</span> <span id="brandName">Family Finance</span></div>
    <nav id="nav">
      <button data-page="dashboard" class="active"><span class="ni">&#9632;</span>Dashboard</button>
      <button data-page="income"><span class="ni">&#8377;</span>Income</button>
      <button data-page="expenses"><span class="ni">&#9636;</span>Expenses</button>
      <button data-page="investments"><span class="ni">&#10548;</span>Monthly Investments</button>
      <button data-page="portfolio"><span class="ni">&#9670;</span>Portfolio</button>
      <button data-page="live"><span class="ni">&#128200;</span>Live Investments</button>
      <button data-page="loans"><span class="ni">&#9878;</span>Loans</button>
      <button data-page="lending"><span class="ni">&#8644;</span>Lending</button>
      <button data-page="goals"><span class="ni">&#9873;</span>Goals</button>
      <button data-page="cards"><span class="ni">&#9646;</span>Cards</button>
      <button data-page="documents"><span class="ni">&#128206;</span>Documents</button>
      <button data-page="settings"><span class="ni">&#9881;</span>Settings</button>
    </nav>
    <div class="sidebar-foot">
      <button id="toggleValues" class="hide-values-btn" onclick="toggleHideValues()" title="Click to hide all values">
        <span class="ni">&#128065;</span><span class="hv-label">Hide values</span>
      </button>
      <button id="themeToggle" class="hide-values-btn" onclick="FFATheme.toggle()" title="Toggle dark / light theme (shared with the Investments page)">
        <span class="ni">&#9681;</span><span class="hv-label">Theme</span>
      </button>
      <div id="saveStatus" class="save-status">All changes saved</div>
      <div id="lastUpdated" class="muted small"></div>
    </div>
  </aside>
  <main id="main"></main>
  <div id="liveHost" class="live-host" hidden>
    <iframe id="liveFrame" class="live-frame" title="Live Investments" src="about:blank"></iframe>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="finance-math.js"></script>
<script src="companion-url.js"></script>
<script src="app.js"></script>
</body>
</html>
